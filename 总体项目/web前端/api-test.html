<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAA系统 - API测试工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .test-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }
        .test-card h3 {
            margin-top: 0;
            color: #495057;
            font-size: 1.2em;
        }
        .test-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .result {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 12px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .warning { color: #ffc107; }
        .info { color: #17a2b8; }
        
        .debug-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            border: 2px solid #e9ecef;
        }
        .debug-section h2 {
            color: #495057;
            margin-top: 0;
        }
        .debug-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .debug-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 OAA系统 API测试工具</h1>
            <p>测试前后端连接状态和数据获取功能</p>
        </div>

        <div class="test-grid">
            <div class="test-card">
                <h3>📡 基础连接测试</h3>
                <button class="test-button" onclick="testConnection()">测试后端连接</button>
                <div class="result" id="connection-result"></div>
            </div>

            <div class="test-card">
                <h3>👥 用户API测试</h3>
                <button class="test-button" onclick="testUsers()">获取用户列表</button>
                <div class="result" id="users-result"></div>
            </div>

            <div class="test-card">
                <h3>🏢 部门API测试</h3>
                <button class="test-button" onclick="testDepartments()">获取部门列表</button>
                <div class="result" id="departments-result"></div>
            </div>

            <div class="test-card">
                <h3>📚 课程API测试</h3>
                <button class="test-button" onclick="testCourses()">获取课程列表</button>
                <div class="result" id="courses-result"></div>
            </div>

            <div class="test-card">
                <h3>🏛️ 租户API测试</h3>
                <button class="test-button" onclick="testTenants()">获取租户列表</button>
                <div class="result" id="tenants-result"></div>
            </div>

            <div class="test-card">
                <h3>🎯 会议API测试</h3>
                <button class="test-button" onclick="testConferences()">获取会议列表</button>
                <div class="result" id="conferences-result"></div>
            </div>

            <div class="test-card">
                <h3>📰 资讯API测试</h3>
                <button class="test-button" onclick="testInformation()">获取资讯列表</button>
                <div class="result" id="information-result"></div>
            </div>

            <div class="test-card">
                <h3>🗄️ 数据库连接测试</h3>
                <button class="test-button" onclick="testDatabase()">测试数据库连接</button>
                <div class="result" id="database-result"></div>
            </div>
        </div>

        <!-- 新增前端调试工具部分 -->
        <div class="debug-section">
            <h2>🔍 前端调试工具</h2>
            
            <div class="debug-card">
                <h3>📋 模拟前端请求</h3>
                <input type="text" class="debug-input" id="debug-url" placeholder="输入API路径，如: /users/all" value="/users/all">
                <button class="test-button" onclick="simulateFrontendRequest()">模拟前端请求</button>
                <div class="result" id="debug-result"></div>
            </div>

            <div class="debug-card">
                <h3>🔐 权限头信息</h3>
                <button class="test-button" onclick="checkAuthHeaders()">检查当前权限头</button>
                <div class="result" id="auth-result"></div>
            </div>

            <div class="debug-card">
                <h3>💾 本地存储信息</h3>
                <button class="test-button" onclick="checkLocalStorage()">检查本地存储</button>
                <div class="result" id="storage-result"></div>
            </div>

            <div class="debug-card">
                <h3>🌐 跨域和请求详情</h3>
                <button class="test-button" onclick="testCorsAndDetails()">测试跨域和请求详情</button>
                <div class="result" id="cors-result"></div>
            </div>
        </div>
    </div>

    <script>
        // 基础配置
        const BASE_URL = 'http://localhost:9049';
        
        // 设置模拟用户信息用于测试
        const mockUserInfo = {
            id: 1,
            username: 'admin',
            role: 'Admin',
            tenantId: 1,
            nickname: '系统管理员'
        };
        
        // 存储到localStorage用于测试
        localStorage.setItem('userInfo', JSON.stringify(mockUserInfo));
        localStorage.setItem('userId', '1');

        // 显示结果的通用函数
        function showResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = content;
            element.className = `result ${type}`;
        }

        // 格式化显示对象
        function formatObject(obj, title = '') {
            if (title) {
                return `${title}:\n${JSON.stringify(obj, null, 2)}`;
            }
            return JSON.stringify(obj, null, 2);
        }

        // 测试基础连接
        async function testConnection() {
            showResult('connection-result', '正在测试连接...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/users/test`);
                const data = await response.text();
                showResult('connection-result', `✅ 连接成功!\n状态: ${response.status}\n响应: ${data}`, 'success');
            } catch (error) {
                showResult('connection-result', `❌ 连接失败: ${error.message}`, 'error');
            }
        }

        // 测试用户API
        async function testUsers() {
            showResult('users-result', '正在获取用户列表...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/users/all`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                if (data.isOK) {
                    showResult('users-result', 
                        `✅ 用户列表获取成功!\n用户数量: ${data.userList?.length || 0}\n${formatObject(data)}`, 
                        'success'
                    );
                } else {
                    showResult('users-result', 
                        `❌ 获取失败: ${data.msg || '未知错误'}\n${formatObject(data)}`, 
                        'error'
                    );
                }
            } catch (error) {
                showResult('users-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 测试部门API
        async function testDepartments() {
            showResult('departments-result', '正在获取部门列表...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/departments/getall?path=`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                if (data.isOK) {
                    showResult('departments-result', 
                        `✅ 部门列表获取成功!\n部门数量: ${data.departmentList?.length || 0}`, 
                        'success'
                    );
                } else {
                    showResult('departments-result', 
                        `❌ 获取失败: ${data.msg || '未知错误'}\n${formatObject(data)}`, 
                        'error'
                    );
                }
            } catch (error) {
                showResult('departments-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 测试课程API
        async function testCourses() {
            showResult('courses-result', '正在获取课程列表...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/api/courses/all`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                showResult('courses-result', 
                    `✅ 课程列表响应:\n${formatObject(data)}`, 
                    data.length > 0 ? 'success' : 'warning'
                );
            } catch (error) {
                showResult('courses-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 测试租户API
        async function testTenants() {
            showResult('tenants-result', '正在获取租户列表...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/api/tenants/all`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                showResult('tenants-result', 
                    `✅ 租户列表响应:\n${formatObject(data)}`, 
                    'success'
                );
            } catch (error) {
                showResult('tenants-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 测试会议API
        async function testConferences() {
            showResult('conferences-result', '正在获取会议列表...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/conferences/all`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                showResult('conferences-result', 
                    `✅ 会议列表响应:\n${formatObject(data)}`, 
                    'success'
                );
            } catch (error) {
                showResult('conferences-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 测试资讯API
        async function testInformation() {
            showResult('information-result', '正在获取资讯列表...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/api/information/all`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                showResult('information-result', 
                    `✅ 资讯列表响应:\n${formatObject(data)}`, 
                    'success'
                );
            } catch (error) {
                showResult('information-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 测试数据库连接
        async function testDatabase() {
            showResult('database-result', '正在测试数据库连接...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/api/test/database`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员'))
                    }
                });
                const data = await response.json();
                
                showResult('database-result', 
                    `✅ 数据库测试响应:\n${formatObject(data)}`, 
                    'success'
                );
            } catch (error) {
                showResult('database-result', `❌ 请求失败: ${error.message}`, 'error');
            }
        }

        // 新增：模拟前端请求
        async function simulateFrontendRequest() {
            const url = document.getElementById('debug-url').value;
            showResult('debug-result', '正在模拟前端请求...', 'info');
            
            try {
                // 模拟axios请求
                const response = await fetch(`${BASE_URL}${url}`, {
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员')),
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                // 模拟前端的数据处理逻辑
                let frontendProcessedData = '';
                if (url.includes('/users/')) {
                    frontendProcessedData = `
前端处理逻辑:
- 期望字段: response.data.userList
- 实际字段: ${Object.keys(data).join(', ')}
- 用户数量: ${data.userList ? data.userList.length : '未找到userList字段'}
- isOK状态: ${data.isOK}
`;
                } else if (url.includes('/departments/')) {
                    frontendProcessedData = `
前端处理逻辑:
- 期望字段: response.data.departmentList
- 实际字段: ${Object.keys(data).join(', ')}
- 部门数量: ${data.departmentList ? data.departmentList.length : '未找到departmentList字段'}
- isOK状态: ${data.isOK}
`;
                }
                
                showResult('debug-result', 
                    `✅ 模拟请求成功!\n${frontendProcessedData}\n原始响应:\n${formatObject(data)}`, 
                    'success'
                );
            } catch (error) {
                showResult('debug-result', `❌ 模拟请求失败: ${error.message}`, 'error');
            }
        }

        // 新增：检查权限头
        function checkAuthHeaders() {
            const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
            const userId = localStorage.getItem('userId');
            
            const headers = {
                'User-Id': userInfo.id || userId,
                'User-Role': userInfo.role || 'User',
                'User-Tenant-Id': userInfo.tenantId || '1',
                'User-Name': userInfo.nickname || userInfo.username || 'Unknown'
            };
            
            showResult('auth-result', 
                `当前权限头信息:\n${formatObject(headers)}\n\n本地存储的用户信息:\n${formatObject(userInfo)}`, 
                'info'
            );
        }

        // 新增：检查本地存储
        function checkLocalStorage() {
            const userInfo = localStorage.getItem('userInfo');
            const userId = localStorage.getItem('userId');
            
            const storage = {
                userInfo: userInfo ? JSON.parse(userInfo) : null,
                userId: userId,
                allLocalStorageKeys: Object.keys(localStorage)
            };
            
            showResult('storage-result', 
                `本地存储信息:\n${formatObject(storage)}`, 
                'info'
            );
        }

        // 新增：测试跨域和请求详情
        async function testCorsAndDetails() {
            showResult('cors-result', '正在测试跨域和请求详情...', 'info');
            
            try {
                const response = await fetch(`${BASE_URL}/users/all`, {
                    method: 'GET',
                    headers: {
                        'User-Id': '1',
                        'User-Role': 'Admin',
                        'User-Tenant-Id': '1',
                        'User-Name': btoa(encodeURIComponent('系统管理员')),
                        'Content-Type': 'application/json'
                    }
                });
                
                const corsHeaders = {
                    'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
                    'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
                    'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers'),
                    'Content-Type': response.headers.get('Content-Type')
                };
                
                const data = await response.json();
                
                showResult('cors-result', 
                    `✅ 跨域测试成功!\n状态码: ${response.status}\n响应头:\n${formatObject(corsHeaders)}\n\n响应数据:\n${formatObject(data)}`, 
                    'success'
                );
            } catch (error) {
                showResult('cors-result', `❌ 跨域测试失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时自动检查基础信息
        window.onload = function() {
            checkLocalStorage();
            checkAuthHeaders();
        };
    </script>
</body>
</html>
